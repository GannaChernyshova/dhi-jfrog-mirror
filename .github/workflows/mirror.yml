name: Mirror DHI → Artifactory

# The "make login / inspect / mirror / verify" steps from the README, run in
# GitHub Actions: copy each tag of the DHI repository, with its signed
# attestations, into the Artifactory repository, by digest, then prove the
# result from Artifactory alone. Run it by hand for the first mirror, or to add
# tags. dhi-jfrog-sync.yml keeps the tags up to date afterwards.
on:
  workflow_dispatch:
    inputs:
      tags:
        description: "Tags to mirror, space separated (default: the TAGS repository variable)"
        required: false
        type: string

concurrency:
  group: dhi-jfrog-sync   # same group as the scheduled sync: never write to the repo twice at once
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      # Repository variables (Settings → Secrets and variables → Actions → Variables)
      DOCKER_ORG: ${{ vars.DOCKER_ORG }}
      SRC_IMAGE: ${{ vars.SRC_IMAGE }}
      DEST_IMAGE: ${{ vars.DEST_IMAGE }}
      TAGS: ${{ inputs.tags || vars.TAGS }}
      JFROG_HOST: ${{ vars.JFROG_HOST }}
      JFROG_REPO: ${{ vars.JFROG_REPO }}
      REGCLIENT_VERSION: v0.11.7
      COSIGN_VERSION: v3.1.4
    steps:
      - uses: actions/checkout@v4

      - name: Install regctl and cosign
        run: |
          curl -sSfL "https://github.com/regclient/regclient/releases/download/${REGCLIENT_VERSION}/regctl-linux-amd64" \
            -o /usr/local/bin/regctl && chmod +x /usr/local/bin/regctl
          curl -sSfL "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64" \
            -o /usr/local/bin/cosign && chmod +x /usr/local/bin/cosign

      # regctl and cosign read the credentials that docker/login-action stores.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Log in to the Scout registry (attestations)
        uses: docker/login-action@v3
        with:
          registry: registry.scout.docker.com
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Log in to Artifactory
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.JFROG_HOST }}
          username: ${{ vars.JFROG_USER }}
          password: ${{ secrets.JFROG_TOKEN }}

      - name: Inspect (make inspect)
        run: bash scripts/02-inspect.sh

      - name: Mirror image and attestations (make mirror)
        run: bash scripts/03-mirror.sh

      - name: Verify from Artifactory (make verify)
        run: bash scripts/04-verify.sh

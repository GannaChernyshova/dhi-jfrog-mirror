name: Mirror DHI into Docker Hub

# Step 1 of the README, with the dhictl CLI: mirror a Docker Hardened Image from
# the DHI catalog into your Docker Hub organization (<org>/<SRC_IMAGE>). Run it
# once per image. Docker keeps the mirror up to date afterwards; the
# "Mirror DHI → Artifactory" workflow then copies it into Artifactory.
on:
  workflow_dispatch:
    inputs:
      src_image:
        description: "Repository to create in your organization. Must start with dhi-, for example dhi-node (default: the SRC_IMAGE variable)"
        required: false
        type: string
      dhi_source:
        description: "Image name in the DHI catalog, for example node (default: the DHI_SOURCE variable, else src_image without dhi-)"
        required: false
        type: string

concurrency:
  group: dhi-hub-mirror
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      # Repository variables (Settings → Secrets and variables → Actions → Variables)
      DHI_ORG: ${{ vars.DHI_ORG }}          # Docker Hub organization
      # A value typed in "Run workflow" wins over the repository variable.
      DHI_SOURCE: ${{ inputs.dhi_source || vars.DHI_SOURCE }}   # image in the DHI catalog, for example: node (optional: defaults to SRC_IMAGE without "dhi-")
      SRC_IMAGE: ${{ inputs.src_image || vars.SRC_IMAGE }}      # repository to create in your organization, must start with dhi-, for example: dhi-node
      DHICTL_VERSION: v0.0.10
    steps:
      - name: Install dhictl
        run: |
          base="https://github.com/docker-hardened-images/dhictl/releases/download/${DHICTL_VERSION}"
          curl -fsSL -o dhictl "$base/dhictl-linux-amd64"
          curl -fsSL -o checksums.txt "$base/dhictl_${DHICTL_VERSION}_checksums.txt"
          grep ' dhictl-linux-amd64$' checksums.txt | sed 's/dhictl-linux-amd64$/dhictl/' | sha256sum -c -
          sudo install -m 0755 dhictl /usr/local/bin/dhictl

      # dhictl needs a short-lived API token, obtained by exchanging the
      # organization access token (identifier = organization name).
      - name: Get a dhictl API token
        env:
          ORG_TOKEN: ${{ secrets.DOCKER_TOKEN }}   # Repository secret
        run: |
          body=$(jq -n --arg id "$DHI_ORG" --arg secret "$ORG_TOKEN" '{identifier: $id, secret: $secret}')
          token=$(curl -fsS -X POST https://hub.docker.com/v2/auth/token \
            -H "Content-Type: application/json" -d "$body" | jq -r .access_token)
          if [ -z "$token" ] || [ "$token" = null ]; then
            echo "::error::Could not get an API token. DHI_ORG must be the organization name and DOCKER_TOKEN an organization access token."
            exit 1
          fi
          echo "::add-mask::$token"
          echo "DHI_API_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Start mirror
        run: |
          for v in DHI_ORG SRC_IMAGE; do
            [ -n "${!v}" ] || { echo "::error::Set $v: as a repository variable (Settings → Secrets and variables → Actions → Variables) or, for SRC_IMAGE, in Run workflow."; exit 1; }
          done
          case "$SRC_IMAGE" in dhi-?*) ;; *)
            echo "::error::SRC_IMAGE must start with dhi- (for example dhi-node), not '$SRC_IMAGE'."; exit 1 ;;
          esac
          source="${DHI_SOURCE:-${SRC_IMAGE#dhi-}}"   # dhi-node → node
          case "$source" in dhi-?*)
            echo "::warning::DHI_SOURCE is the catalog name without the dhi- prefix: using '${source#dhi-}', not '$source'."
            source="${source#dhi-}" ;;
          esac

          # `mirror start` fails if the repository is already a mirror: make a re-run harmless.
          existing=$(dhictl mirror list --org "$DHI_ORG" --filter "$SRC_IMAGE" --json || true)
          if jq -e --arg d "$SRC_IMAGE" --arg org "$DHI_ORG" \
               '[.. | strings] | any(. == $d or . == ($org + "/" + $d))' <<<"$existing" >/dev/null 2>&1; then
            echo "::notice::$DHI_ORG/$SRC_IMAGE is already a mirror, nothing to do. To change its source, stop the mirror in Docker Hub (Hardened Images → Manage) first."
            jq . <<<"$existing"
            exit 0
          fi

          echo "Mirroring dhi/$source into $DHI_ORG/$SRC_IMAGE"
          dhictl mirror start --org "$DHI_ORG" "$source,$SRC_IMAGE"

      - name: Show the mirror
        run: dhictl mirror list --org "$DHI_ORG" --filter "$SRC_IMAGE" --json

name: Build app on DHI from Artifactory

# What an application pipeline looks like once DHI lives in Artifactory:
# pull the base through the consumer URL, verify Docker's signature on it,
# build with SBOM + max provenance, push to the apps repo, scan with Scout.
# Copy this into an app repository and adjust paths.
on:
  push:
    branches: [main]
    paths: ["examples/app/**", ".github/workflows/build-app.yml"]
  pull_request:
    paths: ["examples/app/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Repository variables
      JFROG_HOST: ${{ vars.JFROG_HOST }}            # acme.jfrog.io
      JFROG_REPO: ${{ vars.JFROG_REPO }}            # dhi-local
      JFROG_VIRTUAL: ${{ vars.JFROG_VIRTUAL }}      # docker
      JFROG_APPS_REPO: ${{ vars.JFROG_APPS_REPO }}  # apps-local
      DEST_IMAGE: ${{ vars.DEST_IMAGE || 'dhi-node' }}
      APP_NAME: hello-dhi
      APP_TAG: ${{ github.sha }}
      APP_PLATFORMS: linux/amd64,linux/arm64
      # Pull requests build and verify but do not push
      PUSH: ${{ github.event_name != 'pull_request' }}
      BUILD_PROGRESS: plain
      REGCLIENT_VERSION: v0.11.7
      COSIGN_VERSION: v3.1.4
    steps:
      - uses: actions/checkout@v4

      # CI identity: Read on the virtual + local repos, Deploy on the apps repo.
      # JFrog OIDC (jfrog/setup-jfrog-cli with oidc-provider-name) avoids a
      # long-lived token; a scoped access token is shown for simplicity.
      - name: Log in to Artifactory
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.JFROG_HOST }}
          username: ${{ vars.JFROG_CI_USER }}
          password: ${{ secrets.JFROG_CI_TOKEN }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Install regctl and cosign
        run: |
          curl -sSfL "https://github.com/regclient/regclient/releases/download/${REGCLIENT_VERSION}/regctl-linux-amd64" \
            -o /usr/local/bin/regctl && chmod +x /usr/local/bin/regctl
          curl -sSfL "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64" \
            -o /usr/local/bin/cosign && chmod +x /usr/local/bin/cosign

      # Verifies the DHI base signature from Artifactory and pins it by digest.
      # main: multi-platform build pushed with SBOM + max provenance.
      # pull requests: single-platform build, run and smoke-tested, not pushed.
      - name: Verify base, build, push
        run: bash scripts/06-app.sh

      # Scout follows the provenance back to the DHI base in Artifactory and
      # applies its VEX. Needs a Docker ID + PAT (Scout rejects org tokens).
      - name: Scan with Docker Scout
        if: ${{ env.PUSH == 'true' && vars.SCOUT_USERNAME != '' }}
        uses: docker/scout-action@v1
        with:
          command: cves
          image: registry://${{ vars.JFROG_HOST }}/${{ vars.JFROG_VIRTUAL || vars.JFROG_APPS_REPO }}/hello-dhi:${{ github.sha }}
          dockerhub-user: ${{ vars.SCOUT_USERNAME }}
          dockerhub-password: ${{ secrets.SCOUT_TOKEN }}
          only-severities: critical,high
          exit-code: true

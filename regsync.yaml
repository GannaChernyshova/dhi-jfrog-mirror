version: 1
# Continuous Docker Hub → Artifactory mirror of a DHI repository, with its
# signed attestations. Run it through scripts/05-sync.sh (make sync-once / make
# sync, and the CI jobs do): it reads the settings from the environment and
# writes the tag allow-list from TAGS at the @TAGS@ marker below.
#
# DHI re-points existing tags at new digests on every CVE rebuild; regsync
# detects the new digest and copies it plus its attestations.

creds:
  - registry: docker.io
    user: '{{env "DHI_ORG"}}'
    pass: '{{env "DOCKER_TOKEN"}}'
  - registry: registry.scout.docker.com
    user: '{{env "DHI_ORG"}}'
    pass: '{{env "DOCKER_TOKEN"}}'
  - registry: '{{env "JFROG_HOST"}}'
    user: '{{env "JFROG_USER"}}'
    pass: '{{env "JFROG_TOKEN"}}'

defaults:
  parallel: 2
  interval: 60m

sync:
  - source: 'docker.io/{{env "DHI_ORG"}}/{{env "SRC_IMAGE"}}'
    target: '{{env "JFROG_HOST"}}/{{env "JFROG_REPO"}}/{{env "DEST_IMAGE"}}'
    type: repository
    # Attestations live in the Scout registry, not next to the image on Hub.
    referrers: true
    referrerSource: 'registry.scout.docker.com/{{env "DHI_ORG"}}/{{env "SRC_IMAGE"}}'
    referrerTarget: '{{env "JFROG_HOST"}}/{{env "JFROG_REPO"}}/{{env "DEST_IMAGE"}}'
    # Tag filters are regular expressions and are not templated, so
    # scripts/05-sync.sh fills in one '^tag$' line per tag in TAGS. A DHI repo
    # has thousands of tags: only the ones you list are synced.
    tags:
      allow:
        # @TAGS@
